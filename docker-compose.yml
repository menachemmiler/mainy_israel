services:
  db:
    image: postgres:16-alpine
    container_name: mayanei-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mayanei
      POSTGRES_PASSWORD: mayanei
      POSTGRES_DB: mayanei
    ports:
      - "5432:5432"
    volumes:
      - mayanei_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mayanei -d mayanei"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mayanei_pg:
